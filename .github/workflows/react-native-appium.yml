name: Android Appium Mobile E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  appium-test:
    runs-on: macos-13 # Necessary for hardware acceleration of Android Emulators
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'AppiumTesting/package-lock.json'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p app/build/outputs/apk/release
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk

      - name: Install Project Dependencies
        run: |
          cd AppiumTesting
          npm install

      - name: Install Appium & Drivers
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Run Appium Tests inside Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: |
            # Start Appium server in background
            appium --port 4723 --log appium_server.log &
            # Wait for Appium server to start
            for i in {1..10}; do
              curl -s http://127.0.0.1:4723/status && break
              sleep 2
            done
            # Execute mobile test runner
            cd AppiumTesting
            npm run test
        env:
          APK_PATH: "./app/build/outputs/apk/release/app-release.apk"
          APP_PACKAGE: "com.example.nyayalegalai"
          APP_ACTIVITY: "com.example.nyayalegalai.MainActivity"

      - name: Upload E2E Mobile Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-mobile-reports
          path: |
            AppiumTesting/reports/excel/React native_E2E_Report.xlsx
            AppiumTesting/reports/index.html
            AppiumTesting/reports/failures/
            AppiumTesting/logs/
