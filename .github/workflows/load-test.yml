name: API Load Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'webapp/package-lock.json'

      - name: Install Web App Dependencies
        run: |
          cd webapp
          npm ci

      - name: Install Load Testing Dependencies
        run: |
          cd LoadTesting
          npm install

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Start Express Server in Background
        run: |
          cd webapp
          node server.js &
          # Wait for server to start
          for i in {1..10}; do
            curl -s http://localhost:5000/ && break
            sleep 1
          done
        env:
          PORT: 5000
          GROQ_API_KEY: "dummy_groq_key_for_test"

      - name: Run k6 API Load Test
        run: |
          k6 run --summary-export=LoadTesting/summary.json LoadTesting/load-test.js
        env:
          BACKEND_URL: "http://localhost:5000"

      - name: Parse k6 Summary and Generate Reports
        if: always()
        run: |
          cd LoadTesting
          node parseK6Summary.js
        env:
          BACKEND_URL: "http://localhost:5000"

      - name: Upload Load Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-reports
          path: |
            LoadTesting/reports/load-test-report.xlsx
            LoadTesting/reports/load-test-report.html
