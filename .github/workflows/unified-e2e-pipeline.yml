name: Unified Parallel E2E QA, Security Audit, and Performance Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *' # Nightly at 2 AM
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  selenium:
    name: Selenium Web Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r PythonTesting/requirements.txt

      - name: Run Web Tests
        run: |
          python PythonTesting/run_all_tests.py --suite web

      - name: Upload Web Results
        uses: actions/upload-artifact@v4
        with:
          name: results-web
          path: PythonTesting/reports/results_web.json

  appium:
    name: Appium Mobile Tests
    runs-on: macos-13
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r PythonTesting/requirements.txt

      - name: Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p app
          cp app/build/outputs/apk/debug/app-debug.apk app/app-release.apk

      - name: Run Mobile Tests
        run: |
          python PythonTesting/run_all_tests.py --suite mobile

      - name: Upload Mobile Results
        uses: actions/upload-artifact@v4
        with:
          name: results-mobile
          path: PythonTesting/reports/results_mobile.json

  load:
    name: Load Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r PythonTesting/requirements.txt

      - name: Run Load Tests
        run: |
          python PythonTesting/run_all_tests.py --suite performance

      - name: Upload Load Results
        uses: actions/upload-artifact@v4
        with:
          name: results-performance
          path: PythonTesting/reports/results_performance.json

  security:
    name: DAST Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r PythonTesting/requirements.txt

      - name: Run Security Tests
        run: |
          python PythonTesting/run_all_tests.py --suite security

      - name: Run API Functional Tests
        run: |
          python PythonTesting/run_all_tests.py --suite api

      - name: Upload Security Results
        uses: actions/upload-artifact@v4
        with:
          name: results-security
          path: PythonTesting/reports/results_security.json

      - name: Upload API Results
        uses: actions/upload-artifact@v4
        with:
          name: results-api
          path: PythonTesting/reports/results_api.json

  bundle:
    name: Bundle Reports
    runs-on: ubuntu-latest
    needs: [selenium, appium, load, security]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r PythonTesting/requirements.txt

      - name: Download all results artifacts
        uses: actions/download-artifact@v4
        with:
          path: PythonTesting/reports/
          merge-multiple: true

      - name: Compile and Bundle Reports
        run: |
          python PythonTesting/run_all_tests.py --suite bundle

      - name: Upload Compiled Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-reports
          path: PythonTesting/reports/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: bundle
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Application
        run: |
          cd webapp
          npm install
          npm run build

      - name: Download Compiled Reports
        uses: actions/download-artifact@v4
        with:
          name: compiled-reports
          path: PythonTesting/reports/

      - name: Integrate Reports into Webapp Dist
        run: |
          cp PythonTesting/reports/report.html webapp/dist/report.html
          cp PythonTesting/reports/dashboard.html webapp/dist/dashboard.html
          cp PythonTesting/reports/trends.html webapp/dist/trends.html
          cp PythonTesting/reports/execution-report.html webapp/dist/execution-report.html
          cp PythonTesting/reports/*.xlsx webapp/dist/ || true
          ls -la webapp/dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./webapp/dist

      - name: Upload E2E Report Downloadable Artifacts (30-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: legalai-e2e-master-reports
          path: PythonTesting/reports/
          retention-days: 30

      - name: Publish Markdown Summary
        run: |
          cat PythonTesting/reports/summary.md >> $GITHUB_STEP_SUMMARY
