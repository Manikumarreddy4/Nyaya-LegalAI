name: Enterprise CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Concurrency completely disabled to prevent job cancellation conflicts

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  selenium-web-tests:
    name: Selenium Web Tests
    runs-on: ubuntu-latest
    outputs:
      selenium_reports_url: ${{ steps.upload-selenium-reports.outputs.artifact-url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'SeleniumTesting/package-lock.json'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'PythonTesting/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r PythonTesting/requirements.txt

      - name: Install Web App & Selenium Dependencies
        run: |
          cd webapp
          npm ci
          cd ../SeleniumTesting
          npm install

      - name: Start Web App Backend & Frontend
        run: |
          cd webapp
          node server.js &
          npm run dev &
          for i in {1..15}; do
            curl -s http://localhost:5173/ && curl -s http://localhost:5000/ && break
            sleep 2
          done
        env:
          PORT: 5000
          GROQ_API_KEY: "dummy_groq_key_for_test"

      - name: Run Selenium Tests (Chrome Headless)
        run: |
          cd SeleniumTesting
          npm run test
        env:
          TEST_BASE_URL: "http://localhost:5173"
          TEST_BROWSER: "chrome"
          TEST_HEADLESS: "true"

      - name: Run Python Web Suite (Simulation Fallback)
        run: |
          python PythonTesting/run_all_tests.py --suite web

      - name: Upload Node Selenium Reports
        id: upload-selenium-reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-reports
          path: SeleniumTesting/reports/

      - name: Upload Python Web Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-web
          path: PythonTesting/reports/results_web.json

  appium-mobile-tests:
    name: Appium Mobile Tests
    runs-on: ubuntu-latest
    outputs:
      appium_reports_url: ${{ steps.upload-appium-reports.outputs.artifact-url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: AVD Cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb/*
          key: avd-30

      - name: Cache Android System Image
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images
          key: android-system-images-30
          restore-keys: |
            android-system-images-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'AppiumTesting/package-lock.json'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'PythonTesting/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r PythonTesting/requirements.txt

      - name: Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p app/build/outputs/apk/release
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" -Dkotlin.daemon.jvm.options="-Xmx1536m"

      - name: Install Appium Dependencies
        run: |
          cd AppiumTesting
          npm install

      - name: Cache Appium Drivers
        uses: actions/cache@v4
        id: appium-cache
        with:
          path: ~/.appium
          key: appium-drivers-v1

      - name: Install Appium & Drivers
        run: |
          npm install -g appium
          if [ ! -d ~/.appium/node_modules/appium-uiautomator2-driver ]; then
            appium driver install uiautomator2
          else
            echo "Appium driver restored from cache."
          fi

      - name: Run Appium Tests inside Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: |
            appium --port 4723 --log appium_server.log &
            for i in {1..10}; do
              curl -s http://127.0.0.1:4723/status && break
              sleep 2
            done
            cd AppiumTesting
            npm run test
        env:
          APK_PATH: "../app/build/outputs/apk/release/app-release.apk"
          APP_PACKAGE: "com.example.nyayalegalai"
          APP_ACTIVITY: "com.example.nyayalegalai.MainActivity"

      - name: Run Python Mobile Suite (Simulation Fallback)
        run: |
          python PythonTesting/run_all_tests.py --suite mobile

      - name: Upload Node Appium Reports
        id: upload-appium-reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-reports
          path: AppiumTesting/reports/

      - name: Upload Python Mobile Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-mobile
          path: PythonTesting/reports/results_mobile.json

  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    outputs:
      load_reports_url: ${{ steps.upload-load-reports.outputs.artifact-url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'LoadTesting/package-lock.json'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'PythonTesting/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r PythonTesting/requirements.txt

      - name: Install Web App & Load Testing Dependencies
        run: |
          cd webapp
          npm ci
          cd ../LoadTesting
          npm install

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Load Test
        run: |
          cd webapp
          PORT=5000 GROQ_API_KEY="dummy_groq_key_for_test" node server.js &
          for i in {1..10}; do
            curl -s http://localhost:5000/ && break
            sleep 1
          done
          cd ../LoadTesting
          if [ -f load-test.js ]; then
            k6 run --summary-export=summary.json load-test.js
            npm run parse
          else
            echo "Error: load-test.js configuration missing!"
            exit 1
          fi
        env:
          BACKEND_URL: "http://localhost:5000"

      - name: Run Python Load Suite (Simulation Fallback)
        run: |
          python PythonTesting/run_all_tests.py --suite performance

      - name: Upload k6 Load Reports
        id: upload-load-reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-reports
          path: LoadTesting/reports/

      - name: Upload Python Load Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-performance
          path: PythonTesting/reports/results_performance.json

  dast-security-tests:
    name: DAST Security Tests
    runs-on: ubuntu-latest
    outputs:
      security_reports_url: ${{ steps.upload-security-reports.outputs.artifact-url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'webapp/package-lock.json'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'PythonTesting/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r PythonTesting/requirements.txt

      - name: Run npm audit (Dependency Vulnerability Audit)
        run: |
          cd webapp
          npm audit --audit-level=high || true

      - name: Run Python Security Suite (OWASP Top 10)
        run: |
          python PythonTesting/run_all_tests.py --suite security

      - name: Run Python API Functional Suite
        run: |
          python PythonTesting/run_all_tests.py --suite api

      - name: Upload Python Security Reports
        id: upload-security-reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            PythonTesting/reports/findings.xlsx
            PythonTesting/reports/security-review.md
            PythonTesting/reports/remediation-guide.md
            PythonTesting/reports/backend-inventory.md

      - name: Upload Python Security Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-security
          path: PythonTesting/reports/results_security.json

      - name: Upload Python API Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-api
          path: PythonTesting/reports/results_api.json

  bundle-reports:
    name: Bundle Reports
    runs-on: ubuntu-latest
    needs:
      - selenium-web-tests
      - appium-mobile-tests
      - load-tests
      - dast-security-tests
    outputs:
      combined_reports_url: ${{ steps.upload-combined-reports.outputs.artifact-url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'PythonTesting/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r PythonTesting/requirements.txt

      - name: Create CombinedReports Directory
        run: |
          mkdir -p CombinedReports/Selenium
          mkdir -p CombinedReports/Appium
          mkdir -p CombinedReports/LoadTesting
          mkdir -p CombinedReports/Security

      - name: Download Selenium Reports
        uses: actions/download-artifact@v4
        with:
          name: selenium-reports
          path: CombinedReports/Selenium

      - name: Download Appium Reports
        uses: actions/download-artifact@v4
        with:
          name: appium-reports
          path: CombinedReports/Appium

      - name: Download Load Reports
        uses: actions/download-artifact@v4
        with:
          name: load-reports
          path: CombinedReports/LoadTesting

      - name: Download Security Reports
        uses: actions/download-artifact@v4
        with:
          name: security-reports
          path: CombinedReports/Security

      - name: Download results-web
        uses: actions/download-artifact@v4
        with:
          name: results-web
          path: PythonTesting/reports/

      - name: Download results-mobile
        uses: actions/download-artifact@v4
        with:
          name: results-mobile
          path: PythonTesting/reports/

      - name: Download results-performance
        uses: actions/download-artifact@v4
        with:
          name: results-performance
          path: PythonTesting/reports/

      - name: Download results-security
        uses: actions/download-artifact@v4
        with:
          name: results-security
          path: PythonTesting/reports/

      - name: Download results-api
        uses: actions/download-artifact@v4
        with:
          name: results-api
          path: PythonTesting/reports/

      - name: Compile and Bundle Reports
        run: |
          python PythonTesting/run_all_tests.py --suite bundle

      - name: Create Combined HTML Summary
        run: |
          echo "<html><head><title>Enterprise Test Reports Dashboard</title>" > CombinedReports/index.html
          echo "<style>body{font-family:'Segoe UI',sans-serif;background-color:#0f172a;color:#f8fafc;padding:40px;}" >> CombinedReports/index.html
          echo "h1{color:#38bdf8;}a{color:#60a5fa;text-decoration:none;}a:hover{text-decoration:underline;}</style></head>" >> CombinedReports/index.html
          echo "<body><h1>Nyaya Legal AI - Combined Enterprise Reports</h1>" >> CombinedReports/index.html
          echo "<p>Execution Date: $(date)</p><ul>" >> CombinedReports/index.html
          echo "<li><a href='./report.html'>Interactive Master Dashboard</a></li>" >> CombinedReports/index.html
          echo "<li><a href='./dashboard.html'>HTML Dashboard Stats</a></li>" >> CombinedReports/index.html
          echo "<li><a href='./trends.html'>HTML Execution Trends</a></li>" >> CombinedReports/index.html
          echo "<li><a href='./Selenium/index.html'>Selenium Web Test Details</a></li>" >> CombinedReports/index.html
          echo "<li><a href='./Appium/index.html'>Appium Mobile Test Details</a></li>" >> CombinedReports/index.html
          echo "<li><a href='./LoadTesting/load-test-report.html'>k6 Performance Test Details</a></li>" >> CombinedReports/index.html
          echo "</ul></body></html>" >> CombinedReports/index.html

      - name: Create markdown summary
        run: |
          echo "# Nyaya Legal AI Consolidated Test Report Summary" > CombinedReports/summary.md
          echo "Generated at: $(date)" >> CombinedReports/summary.md
          echo "" >> CombinedReports/summary.md
          echo "## Included Test Domain Reports (Click to Download):" >> CombinedReports/summary.md
          echo "* **Selenium Web E2E Reports:** [Download Artifact](${{ needs.selenium-web-tests.outputs.selenium_reports_url }})" >> CombinedReports/summary.md
          echo "* **Appium Mobile E2E Reports:** [Download Artifact](${{ needs.appium-mobile-tests.outputs.appium_reports_url }})" >> CombinedReports/summary.md
          echo "* **API Load Performance Reports:** [Download Artifact](${{ needs.load-tests.outputs.load_reports_url }})" >> CombinedReports/summary.md
          echo "* **OWASP Top 10 Security Audit Reports:** [Download Artifact](${{ needs.dast-security-tests.outputs.security_reports_url }})" >> CombinedReports/summary.md
          echo "" >> CombinedReports/summary.md
          cat PythonTesting/reports/summary.md >> CombinedReports/summary.md || true

      - name: Integrate Compiled Reports into CombinedReports
        run: |
          cp PythonTesting/reports/report.html CombinedReports/report.html || true
          cp PythonTesting/reports/dashboard.html CombinedReports/dashboard.html || true
          cp PythonTesting/reports/trends.html CombinedReports/trends.html || true
          cp PythonTesting/reports/execution-report.html CombinedReports/execution-report.html || true
          cp PythonTesting/reports/*.xlsx CombinedReports/ || true

      - name: Upload Combined Reports Artifact
        id: upload-combined-reports
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-test-reports
          path: CombinedReports/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - bundle-reports
      - selenium-web-tests
      - appium-mobile-tests
      - load-tests
      - dast-security-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'webapp/package-lock.json'

      - name: Build Web Application
        run: |
          cd webapp
          npm ci
          npm run build

      - name: Download Combined Reports
        uses: actions/download-artifact@v4
        with:
          name: enterprise-test-reports
          path: CombinedReports/

      - name: Copy Reports to Webapp Dist
        run: |
          cp CombinedReports/index.html webapp/dist/index.html || true
          cp CombinedReports/report.html webapp/dist/report.html || true
          cp CombinedReports/dashboard.html webapp/dist/dashboard.html || true
          cp CombinedReports/trends.html webapp/dist/trends.html || true
          cp CombinedReports/execution-report.html webapp/dist/execution-report.html || true
          cp CombinedReports/*.xlsx webapp/dist/ || true
          cp -r CombinedReports/Selenium webapp/dist/Selenium || true
          cp -r CombinedReports/Appium webapp/dist/Appium || true
          cp -r CombinedReports/LoadTesting webapp/dist/LoadTesting || true
          cp -r CombinedReports/Security webapp/dist/Security || true
          ls -la webapp/dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./webapp/dist

      - name: Publish Markdown Summary
        run: |
          echo "### 📥 Clickable Download Reports" > summary_with_bundle.md
          echo "* **Consolidated Enterprise Reports Bundle:** [Download Bundle ZIP](${{ needs.bundle-reports.outputs.combined_reports_url }})" >> summary_with_bundle.md
          echo "" >> summary_with_bundle.md
          cat CombinedReports/summary.md >> summary_with_bundle.md
          cat summary_with_bundle.md >> $GITHUB_STEP_SUMMARY
