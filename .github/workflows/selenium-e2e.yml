name: Web Selenium E2E

on:
  workflow_dispatch:

jobs:
  selenium-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'SeleniumTesting/package-lock.json'

      - name: Install Web App Dependencies
        run: |
          cd webapp
          npm ci

      - name: Install Selenium Testing Dependencies
        run: |
          cd SeleniumTesting
          npm install

      - name: Start Web App Backend & Frontend
        run: |
          cd webapp
          node server.js &
          npm run dev &
          # Wait for server and vite
          for i in {1..15}; do
            curl -s http://localhost:5173/ && curl -s http://localhost:5000/ && break
            sleep 2
          done
        env:
          PORT: 5000
          GROQ_API_KEY: "dummy_groq_key_for_test"

      - name: Run Selenium Tests (Chrome Headless)
        run: |
          cd SeleniumTesting
          npm run test
        env:
          TEST_BASE_URL: "http://localhost:5173"
          TEST_BROWSER: "chrome"
          TEST_HEADLESS: "true"

      - name: Upload E2E Web Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-reports
          path: |
            SeleniumTesting/reports/excel/E2E_Report.xlsx
            SeleniumTesting/reports/index.html
            SeleniumTesting/reports/failures/
            SeleniumTesting/logs/
